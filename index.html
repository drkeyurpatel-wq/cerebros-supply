<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0f2a6b">
<title>Cerebros Supply</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: marketplace shell — sticky header with search + category bar, product grids and rails; back office = dark sidebar + light work area */
  --brand:#0f2a6b;--brand-2:#1d4ed8;--brand-soft:#e8efff;--deal:#ea580c;--deal-soft:#fff1e6;
  --ink:#101828;--ink-2:#344054;--muted:#667085;--bg:#f2f4f8;--surface:#fff;--line:#e4e7ec;--line-2:#d0d5dd;
  --good:#067647;--good-soft:#e7f6ee;--warn:#b54708;--warn-soft:#fef4e6;--bad:#b42318;--bad-soft:#fef1f0;
  --font:"Plus Jakarta Sans","Segoe UI",Roboto,Arial,sans-serif;--r:14px;--sh:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);--sh-lg:0 12px 32px rgba(16,24,40,.14);
  color-scheme:light}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:3px solid var(--brand-2);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;letter-spacing:-.01em;text-wrap:balance}h1{font-size:26px;font-weight:800}h2{font-size:20px;font-weight:800}h3{font-size:16px;font-weight:700}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
input,select,textarea{border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;background:#fff;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--brand-2);outline:3px solid #cddcff;outline-offset:0}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--ink-2)}
.form label.f{flex:1 1 200px}
.sh input,.sh select{color:var(--ink)}
.check{display:flex;gap:8px;align-items:center;font-weight:600;font-size:14px}.check input{width:18px;height:18px;flex:none}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:11px 18px;font-weight:700;background:var(--brand-2);color:#fff;white-space:nowrap;transition:background .15s}
.btn:hover{background:#1a43c0}.btn.lg{padding:14px 22px;font-size:16px}.btn.sm{padding:8px 12px;font-size:13px}.btn.block{width:100%}
.btn.deal{background:var(--deal)}.btn.deal:hover{background:#c2410c}
.btn.ghost{background:#fff;color:var(--brand-2);box-shadow:inset 0 0 0 1.5px var(--brand-2)}.btn.ghost:hover{background:var(--brand-soft)}
.btn.plain{background:#fff;color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line-2)}.btn.plain:hover{background:#f9fafb}
.btn.red{background:#fff;color:var(--bad);box-shadow:inset 0 0 0 1.5px #f3b4ae}
.btn:disabled{background:#d0d5dd;box-shadow:none;color:#fff;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.g{background:var(--good-soft);color:var(--good)}.pill.w{background:var(--warn-soft);color:var(--warn)}.pill.b{background:var(--bad-soft);color:var(--bad)}.pill.n{background:#eef1f5;color:var(--ink-2)}.pill.blue{background:var(--brand-soft);color:var(--brand-2)}
.alert{border-radius:12px;padding:12px 14px;font-weight:600;font-size:14px}
.alert.bad{background:var(--bad-soft);color:#7a271a;border:1px solid #fbd0cb}.alert.warn{background:var(--warn-soft);color:#7a2e0e;border:1px solid #fbdcae}.alert.good{background:var(--good-soft);color:#054f31;border:1px solid #b5e3c9}.alert.info{background:var(--brand-soft);color:#173a8f;border:1px solid #c9d8ff}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.empty{background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--r);padding:40px 20px;text-align:center;color:var(--muted)}
/* ---------- store header ---------- */
.sh{position:sticky;top:0;z-index:40;background:var(--brand);color:#fff;box-shadow:0 2px 10px rgba(15,42,107,.25)}
.sh-top{display:flex;align-items:center;gap:18px;padding-top:12px;padding-bottom:12px}
.logo{display:flex;align-items:center;gap:10px;font-size:19px;letter-spacing:-.01em;flex:none}.logo b{font-weight:800}.logo span{font-weight:500;opacity:.85}
.logo svg{width:34px;height:34px;flex:none}
.search{position:relative;flex:1 1 auto;min-width:0}
.search input{height:46px;border:0;border-radius:12px;padding-left:44px;font-size:15px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.search .si{position:absolute;left:14px;top:13px;width:20px;height:20px;color:var(--muted)}
.sugg{position:absolute;left:0;right:0;top:52px;background:#fff;color:var(--ink);border-radius:14px;box-shadow:var(--sh-lg);overflow:hidden;z-index:60}
.sugg a,.sugg button{display:flex;gap:12px;align-items:center;padding:10px 14px;width:100%;text-align:left}
.sugg a:hover,.sugg a.on,.sugg button:hover{background:#f5f8ff}
.sugg .sp{width:44px;height:44px;flex:none}.sugg .sn{flex:1;min-width:0}.sugg .sn b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sugg .sn small{color:var(--muted)}
.sugg .sv{font-weight:800}.sugg .all{border-top:1px solid var(--line);color:var(--brand-2);font-weight:700;justify-content:center}
.sugg .shead{padding:10px 14px 4px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hact{display:flex;align-items:center;gap:6px;flex:none}
.hbtn{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;color:#fff;font-weight:600;font-size:14px}
.hbtn:hover{background:rgba(255,255,255,.1)}
.hbtn .two{display:flex;flex-direction:column;line-height:1.15}.hbtn .two small{font-size:11.5px;opacity:.75;font-weight:500}.hbtn .two b{font-size:14px}
.hbtn svg{width:22px;height:22px}
.cartbtn{background:var(--deal);position:relative}.cartbtn:hover{background:#c2410c}
.cartbtn .cnt{position:absolute;top:-6px;left:20px;background:#fff;color:var(--deal);border-radius:99px;font-size:11px;font-weight:800;min-width:19px;height:19px;display:grid;place-items:center;padding:0 5px}
.forh{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border-radius:10px;padding:4px 4px 4px 10px;font-size:12.5px;font-weight:600}
.forh select{width:auto;max-width:200px;padding:6px 8px;border:0;font-size:13px;font-weight:600}
.sh-nav{background:#0b2258;border-top:1px solid rgba(255,255,255,.08)}
.sh-nav .wrap{display:flex;gap:4px;align-items:center;overflow-x:auto;scrollbar-width:none}
.sh-nav a,.sh-nav button{color:#dbe4ff;padding:10px 12px;font-size:14px;font-weight:600;white-space:nowrap;border-radius:8px}
.sh-nav a:hover,.sh-nav button:hover{color:#fff;background:rgba(255,255,255,.08)}
.sh-nav .allcats{color:#fff;display:flex;gap:8px;align-items:center}.sh-nav .allcats svg{width:18px;height:18px}
.sh-nav .hot{color:#ffb98a}
.mega{position:absolute;left:0;right:0;top:100%;background:#fff;color:var(--ink);box-shadow:var(--sh-lg);border-top:1px solid var(--line)}
.mega .wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;padding-top:22px;padding-bottom:26px}
.mega h3{display:flex;align-items:center;gap:10px;margin-bottom:10px}.mega h3 .mp{width:40px;height:40px}
.mega a{display:flex;justify-content:space-between;padding:7px 10px;border-radius:8px;font-weight:500}.mega a:hover{background:#f5f8ff;color:var(--brand-2)}.mega a small{color:var(--muted)}
/* ---------- store main ---------- */
.smain{padding:22px 0 90px}
.crumbs{font-size:13px;color:var(--muted);margin-bottom:14px;display:flex;gap:6px;flex-wrap:wrap}.crumbs a:hover{color:var(--brand-2)}
.hero{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;margin-bottom:26px}
.hero-a{border-radius:20px;padding:34px 36px;color:#fff;background:radial-gradient(circle at 85% 20%,rgba(255,255,255,.14),transparent 40%),linear-gradient(120deg,#0f2a6b 0%,#1d4ed8 70%,#3b82f6 100%);position:relative;overflow:hidden;min-height:230px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.hero-a h1{font-size:34px;line-height:1.1;max-width:15ch}.hero-a p{margin:0;max-width:44ch;opacity:.9;font-size:16px}
.hero-a .hs{display:flex;gap:22px;margin-top:6px;flex-wrap:wrap}.hero-a .hs div b{display:block;font-size:22px;font-weight:800}.hero-a .hs div small{opacity:.8;font-size:12.5px}
.hero-a .art{position:absolute;right:-10px;bottom:-14px;width:210px;opacity:.95}
.hero-b{border-radius:20px;padding:22px;background:#fff;border:1px solid var(--line);box-shadow:var(--sh);display:flex;flex-direction:column;gap:12px}
.ccard{border-radius:16px;padding:18px;color:#fff;background:linear-gradient(135deg,#111827,#1f3a8a);position:relative;overflow:hidden}
.ccard:after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.07)}
.ccard small{opacity:.75;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}.ccard .big{font-size:28px;font-weight:800;margin:4px 0 12px}
.ccard .bar{height:8px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}.ccard .bar i{display:block;height:100%;background:#34d399}.ccard .bar i.w{background:#fbbf24}.ccard .bar i.b{background:#f87171}
.ccard .row2{display:flex;justify-content:space-between;margin-top:10px;font-size:13px;opacity:.85}
.newh{margin-top:6px;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}.newh span{color:var(--muted);font-size:13.5px}
.ccard .big em{font-style:normal;font-size:15px;font-weight:600;opacity:.8}
.paybox{position:relative;z-index:1;display:grid;grid-template-columns:1fr auto;gap:2px 12px;background:rgba(255,255,255,.1);border-radius:12px;padding:12px 14px}
.paybox span{font-size:12.5px;opacity:.8}.paybox b{grid-row:span 2;align-self:center;font-size:20px}.paybox i{font-style:normal;font-size:13px;opacity:.9}
.paybox.w{background:rgba(251,191,36,.22)}.paybox.b{background:rgba(248,113,113,.28)}
.steps4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.steps4 div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;font-size:13.5px;color:var(--muted)}
.steps4 div b{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:14.5px;margin-bottom:4px}.steps4 div i{font-style:normal;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#eef2f7;color:var(--muted);font-size:12.5px;font-weight:800}
.steps4 div.d i{background:#059669;color:#fff}.steps4 div.c{border-color:#1d4ed8;box-shadow:0 0 0 3px #dbe5ff}.steps4 div.c i{background:#1d4ed8;color:#fff}
.docs{display:flex;flex-direction:column;gap:10px}.doc{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.doc .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:#f2f5fb;color:#1d4ed8}.doc .ic svg{width:22px;height:22px}
.doc.ok .ic{background:#e7f8ef;color:#059669}.doc.bad .ic{background:#fdecec;color:#dc2626}.doc.wait .ic{background:#fff6e5;color:#d97706}
.doc b{display:block}.doc small{color:var(--muted)}.doc .r{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.files{margin-top:6px;display:flex;flex-direction:column;gap:4px}.files div{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.lock{max-width:980px;margin:0 auto;padding:24px 18px 60px}.lockbar{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;background:#0f2a6b;color:#fff}
.lockbar .logo b{color:#fff}.qcard{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;text-align:left;margin-bottom:10px}.qcard .acts{justify-content:flex-end;margin:0}
@media(max-width:760px){.steps4{grid-template-columns:1fr 1fr}.doc{grid-template-columns:36px 1fr}.doc .r{grid-column:1/-1;justify-content:flex-start}.qcard{grid-template-columns:1fr}}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mini div{background:#f7f9fc;border-radius:12px;padding:10px 12px}.mini b{display:block;font-size:17px}.mini small{color:var(--muted);font-size:12px}
.sec{margin:30px 0 14px;display:flex;align-items:end;justify-content:space-between;gap:12px}.sec a{color:var(--brand-2);font-weight:700;font-size:14px}
.cats3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.cat3{display:flex;align-items:center;gap:16px;padding:18px;border-radius:18px;background:#fff;border:1px solid var(--line);box-shadow:var(--sh);transition:transform .15s,box-shadow .15s}
.cat3:hover{transform:translateY(-2px);box-shadow:var(--sh-lg)}.cat3 .cp{width:86px;height:86px;flex:none}.cat3 b{display:block;font-size:17px}.cat3 small{color:var(--muted)}
.needs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.need{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 10px;border-radius:14px;background:#fff;border:1px solid var(--line);text-align:center;font-weight:700;font-size:13.5px;transition:border-color .15s}
.need:hover{border-color:var(--brand-2);color:var(--brand-2)}.need .np{width:64px;height:64px}.need small{color:var(--muted);font-weight:500}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(200px,1fr);gap:14px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.rail>*{scroll-snap-align:start}
@media(min-width:1100px){.rail{grid-auto-columns:calc((100% - 70px)/6)}}
/* product card */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .15s,transform .15s}
.card:hover{box-shadow:var(--sh-lg);transform:translateY(-2px)}
.card-img{position:relative;display:block;aspect-ratio:1/1;padding:14px}
.card-img .pic{width:100%;height:100%}
.off{position:absolute;left:10px;top:10px;background:var(--deal);color:#fff;font-weight:800;font-size:12px;border-radius:8px;padding:4px 8px}
.cold{position:absolute;right:10px;top:10px;background:#e0f2fe;color:#075985;font-weight:700;font-size:11px;border-radius:8px;padding:4px 7px}
.smp{position:absolute;right:10px;bottom:10px;background:rgba(16,24,40,.7);color:#fff;font-weight:600;font-size:10.5px;border-radius:6px;padding:2px 6px}
.card-b{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.card-sub{font-size:11.5px;font-weight:700;color:var(--brand-2);text-transform:uppercase;letter-spacing:.04em}
.card-t{font-weight:700;font-size:14.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.card-t:hover{color:var(--brand-2)}
.card-p{font-size:12.5px;color:var(--muted)}
.card-pr{display:flex;align-items:baseline;gap:8px;margin:6px 0 8px;flex-wrap:wrap}.card-pr b{font-size:19px;font-weight:800}.card-pr s{color:var(--muted);font-size:13px}
.card .btn{width:100%;margin-top:auto}
.qty{display:flex;align-items:center;justify-content:space-between;border-radius:10px;background:var(--brand-soft);margin-top:auto;overflow:hidden}
.qty button{width:42px;height:42px;font-size:20px;font-weight:800;color:var(--brand-2)}.qty button:hover{background:#d6e3ff}
.qty input{width:64px;border:0;background:transparent;text-align:center;font-weight:800;padding:0;height:42px;font-size:15px}
.qty input:focus{outline:none}
.pic{position:relative;display:block;border-radius:12px;background:var(--pbg);overflow:hidden}
.pic svg{width:100%;height:100%;display:block}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
/* listing */
.listing{display:grid;grid-template-columns:250px 1fr;gap:22px;align-items:start}
.filters{position:sticky;top:130px;padding:16px;display:flex;flex-direction:column;gap:18px;max-height:calc(100vh - 150px);overflow:auto}
.filters h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:8px}
.ftree a{display:flex;justify-content:space-between;padding:6px 8px;border-radius:8px;font-size:14px;font-weight:600}.ftree a:hover{background:#f5f8ff}.ftree a.on{background:var(--brand-soft);color:var(--brand-2)}
.ftree .subs{margin-left:10px;border-left:2px solid var(--line);padding-left:6px}.ftree .subs a{font-weight:500}
.ftree small{color:var(--muted);font-weight:500}
.fchips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-2);background:#fff;border-radius:99px;padding:7px 12px;font-weight:600;font-size:13px;color:var(--ink-2)}.chip.on{background:var(--brand-2);border-color:var(--brand-2);color:#fff}
.lhead{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.lhead select{width:auto}
.active-f{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.active-f button{background:#fff;border:1px solid var(--line-2);border-radius:99px;padding:5px 10px;font-size:12.5px;font-weight:600}
.fbtn{display:none!important}
/* product page */
.pdp{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
.pdp-img{padding:26px;position:sticky;top:130px}.pdp-img .pic{aspect-ratio:1/1}
.pdp-i{display:flex;flex-direction:column;gap:14px}
.pdp-i h1{font-size:28px;line-height:1.2}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.pbox{padding:20px;display:flex;flex-direction:column;gap:14px}
.pbig{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}.pbig b{font-size:32px;font-weight:800}.pbig s{color:var(--muted);font-size:16px}
.pbig .save{background:var(--deal-soft);color:var(--deal);font-weight:800;border-radius:8px;padding:4px 9px;font-size:13px}
.pact{display:grid;grid-template-columns:160px 1fr 1fr;gap:10px}.pact .qty{margin:0}
.perks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.perks div{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink-2)}.perks svg{width:22px;height:22px;color:var(--brand-2);flex:none}.perks b{display:block;color:var(--ink)}
.spec{width:100%;border-collapse:collapse}.spec td{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}.spec td:first-child{color:var(--muted);width:40%}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:70;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(440px,100%);background:#fff;z-index:80;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column;box-shadow:var(--sh-lg)}
.drawer.on{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
.db{flex:1;overflow:auto;padding:8px 20px}
.df{border-top:1px solid var(--line);padding:16px 20px;display:flex;flex-direction:column;gap:10px;background:#fcfcfd}
.cl{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.cl .pic{width:64px;height:64px}.cl b{font-size:14px;display:block;line-height:1.3}.cl small{color:var(--muted)}
.cl .clr{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:10px}.cl .qty{width:132px;margin:0}.cl .qty button{width:36px;height:36px}.cl .qty input{height:36px;width:56px}
.rm{color:var(--muted);font-size:12.5px;font-weight:600;text-decoration:underline}
.tot{display:flex;justify-content:space-between;font-size:14px}.tot.big{font-size:18px;font-weight:800}.tot .save{color:var(--good);font-weight:700}

const STORE_R=/^(home|shop|checkout|orders|account|docs|p-\d+|o-\d+|done-\d+)$/, OFFICE_R=["dash","access","board","hospitals","payments","catalogue","demand","users","company"];

  <div class="tw"><table class="t" style="min-width:600px"><thead><tr><th>Product</th><th>HSN</th><th>Batch</th><th>Expiry</th><th class="n">Qty</th><th class="n">Rate</th><th class="n">GST</th><th class="n">Amount</th></tr></thead><tbody>
  ${r.order.lines.map(l=>`<tr><td>${esc(l.name)}<br><small class="muted">per ${esc(l.pack)}${l.case_date?` · case ${dstr(l.case_date)}, ${esc(l.surgeon)}`:""}</small></td><td>${esc(l.hsn)}</td><td>${esc(l.batch)}</td><td>${dstr(l.expiry)}</td><td class="n">${+l.qty}</td><td class="n">${fmtR(l.rate)}</td><td class="n">${+l.gst_rate}%</td><td class="n">${fmtR(l.qty*l.rate)}</td></tr>`).join("")}</tbody></table></div>
  <div class="sum2"><div><span>Taxable value</span><span class="num">${fmtR(b.taxable)}</span></div>${same?`<div><span>CGST</span><span class="num">${fmtR(b.gst/2)}</span></div><div><span>SGST</span><span class="num">${fmtR(b.gst/2)}</span></div>`:`<div><span>IGST</span><span class="num">${fmtR(b.gst)}</span></div>`}
  <div class="t"><span>Total</span><span class="num">${fmtR(b.total)}</span></div><div><span>Received</span><span class="num">${fmtR(b.paid)}</span></div><div><span>Still to pay</span><b class="num">${fmtR(b.due)}</b></div></div>
  <div class="acts noprint"><button class="btn plain" data-close>Close</button><button class="btn" id="printbill">Print</button></div></div>`);
}
function pinDlg(){
  openDlg(`<form id="f-pin">${dlgHead("Change PIN")}<div class="form">${fld("p-old","Old PIN","",'type="password" inputmode="numeric" maxlength="6" required')}${fld("p-new","New PIN (4 to 6 digits)","",'type="password" inputmode="numeric" maxlength="6" required')}</div><div class="acts"><button type="button" class="btn plain" data-close>Cancel</button><button class="btn">Change PIN</button></div></form>`);
  $("f-pin").onsubmit=e=>{e.preventDefault();run(async()=>{await api("change_pin",{old:$("p-old").value,new:$("p-new").value});closeDlg();toast("PIN changed")})};
}
/* ---------- auth ---------- */
function applyView(){
  $("app").querySelector(".auth-b").innerHTML=`<form class="auth-card" id="applyform"><h2>Apply for access</h2><p class="muted" style="margin:0">For hospitals that want to buy from Cerebros. After you apply, upload your drug licences and registration. Prices open once Cerebros approves the hospital.</p>
   <label class="f">Hospital name<input id="ap-h" required maxlength="120"></label><label class="f">City<input id="ap-city" required maxlength="60"></label>
   <label class="f">Beds (optional)<input id="ap-beds" inputmode="numeric" maxlength="4"></label><label class="f">GSTIN (optional)<input id="ap-gst" maxlength="15" style="text-transform:uppercase"></label>
   <label class="f">Your name (owner or director)<input id="ap-name" required maxlength="80"></label><label class="f">Your mobile number<input id="ap-mob" inputmode="numeric" maxlength="10" required autocomplete="username"></label>
   <label class="f">Choose a PIN (4 to 6 digits)<input id="ap-pin" type="password" inputmode="numeric" maxlength="6" required autocomplete="new-password"></label>
   <button class="btn lg block">Apply</button><small class="muted">Already have a login? <a href="#" id="tologin"><b>Log in</b></a></small></form>`;
  $("applyform").onsubmit=e=>{e.preventDefault();run(async()=>{const r=await api("apply",{hospital:$("ap-h").value,city:$("ap-city").value,beds:$("ap-beds").value.replace(/\D/g,""),gstin:$("ap-gst").value.trim().toUpperCase(),name:$("ap-name").value,mobile:$("ap-mob").value.replace(/\D/g,"").slice(-10),pin:$("ap-pin").value});
    S.token=r.token;store.set("cs_token",r.token);start(r.user)})}}
function authView(setup){
  $("app").innerHTML=`<div class="auth"><div class="auth-a"><a class="logo" href="#">${LOGO}<b>Cerebros</b><span>Supply</span></a><div><h1>One store for every hospital supply</h1><p>Medicines, consumables and implants at group buying rates, on credit, delivered with batch and expiry on every bill.</p></div>
   <ul><li><span>${I.shield}</span>Only approved hospitals and their approved staff can see prices</li><li><span>${I.card}</span>Order now, pay within your credit period</li><li><span>${I.truck}</span>Pick a delivery slot and track every order</li></ul></div>
   <div class="auth-b"><form class="auth-card" id="authform"><h2>${setup?"Set up the first manager":"Log in"}</h2><p class="muted" style="margin:0">${setup?"Use the one-time setup code.":"Use the mobile number and PIN given to you."}</p>
    ${setup?`<label class="f">Setup code<input id="a-code" required autocomplete="off"></label><label class="f">Your name<input id="a-name" required></label>`:""}
    <label class="f">Mobile number<input id="a-mobile" inputmode="numeric" maxlength="14" required autocomplete="username" placeholder="10-digit mobile"></label>
    <label class="f">${setup?"Choose a PIN (4 to 6 digits)":"PIN"}<input id="a-pin" type="password" inputmode="numeric" maxlength="6" required autocomplete="${setup?"new-password":"current-password"}"></label>
    <button class="btn lg block">${setup?"Create login":"Log in"}</button>${setup?"":`<small class="muted">Forgot your PIN? Ask your hospital owner or the Cerebros desk to reset it.</small><div class="newh"><b>New hospital?</b><span>Apply for access. Cerebros checks your licences before prices open.</span><button type="button" class="btn ghost block" id="toapply">Apply for access</button></div>`}</form></div></div>`;
  if(!setup)$("toapply").onclick=applyView;
  $("authform").onsubmit=e=>{e.preventDefault();run(async()=>{
    const d={mobile:$("a-mobile").value.replace(/\D/g,"").slice(-10),pin:$("a-pin").value};if(setup){d.code=$("a-code").value.trim().toUpperCase();d.name=$("a-name").value}
    const r=await api(setup?"setup":"login",d);S.token=r.token;store.set("cs_token",r.token);start(r.user)})};
}
function start(u){S.user=u;if(isH())S.mode="store";render()}
async function boot(){
  try{if(S.token){try{start(await api("me"));return}catch(e){if(S.token)throw e}}
    const s=await api("status");authView(s.needs_setup)}
  catch(e){$("app").innerHTML=`<div class="empty" style="margin:20vh auto;max-width:420px"><div class="alert bad">${esc(e.message)}</div><br><button class="btn ghost" onclick="location.reload()">Try again</button></div>`}
}
/* ---------- events ---------- */
function applyNav(d){const f={};if(d.cat!==undefined)f.cat=+d.cat;if(d.sub)f.subs=[d.sub];if(d.save)f.save=+d.save;if(d.cold)f.cold=true;resetF(f)}
document.addEventListener("click",e=>{
  const t=e.target.closest("button,a");
  if(!t){const m=$("mega");if(m&&!e.target.closest("#mega"))m.hidden=true;const sg=$("sugg");if(sg&&!e.target.closest(".search"))sg.hidden=true;return}
  const d=t.dataset;
  if("close" in d){closeDlg();S.fromDocs=false;return}
  if(t.id==="tologin"){e.preventDefault();boot();return}
  if(!S.user)return;
  if(d.docview){e.preventDefault();run(()=>viewDoc(+d.docview));return}
  if(d.docup){S.fromDocs=!!$("dlg-docs-host");run(async()=>{await docTypes();uploadDlg(d.docup,isH()||S.user.access==="applicant"?null:(S.fromDocs?S.docHid:S.forH))});return}
  if(d.docdel){if(t.dataset.sure){const fd=!!$("dlg-docs-host");run(async()=>{await api("doc_delete",{id:+d.docdel});toast("Removed");S.fromDocs=fd;await afterDocs()})}else{t.dataset.sure=1;t.textContent="Tap again to remove"}return}
  if(d.dockok){const fd=!!$("dlg-docs-host");run(async()=>{await api("doc_check",{id:+d.dockok,decision:"verify"});toast("Accepted");S.fromDocs=fd;await afterDocs()});return}
  if(d.docrej){S.fromDocs=!!$("dlg-docs-host");decideDlg("docrej",+d.docrej);return}
  if(d.hdocs){run(()=>openHospDocs(+d.hdocs));return}
  if(d.happrove){approveDlg(+d.happrove);return}
  if(d.hreject){decideDlg("hreject",+d.hreject);return}
  if(d.hsuspend){decideDlg("hsuspend",+d.hsuspend);return}
  if(d.hreinstate){run(async()=>{await api("hospital_decide",{id:+d.hreinstate,decision:"reinstate"});closeDlg();toast("Access given back");render()});return}
  if(d.uok){run(async()=>{await api("user_decide",{id:+d.uok,decision:"approve"});toast("Approved. They can log in now.");render()});return}
  if(d.uno){decideDlg("uno",+d.uno);return}
  if(t.id==="logout"){run(async()=>{try{await api("logout")}catch(x){}S.token=null;S.user=null;store.del("cs_token");location.hash="";boot()});return}
  if(t.id==="pinbtn"){pinDlg();return}
  if(t.id==="printbill"){window.print();return}
  if(t.id==="allcats"){const m=$("mega");m.hidden=!m.hidden;return}
  if(t.id==="cartbtn"||t.id==="cartbtn2"){openDrawer();return}
  if("closecart" in d){closeDrawer()}
  if(d.cat!==undefined||d.save||d.cold||d.sub){applyNav(d);if($("mega"))$("mega").hidden=true;if(route()==="shop"&&t.getAttribute("href")==="#shop"){e.preventDefault();render()}return}
  if(d.jump){e.preventDefault();const el=$(d.jump);if(el)el.scrollIntoView({behavior:"smooth"});return}
  if("searchall" in d){S.f=Object.assign(S.f,{q:$("q").value.trim(),cat:-1,subs:[]});$("sugg").hidden=true;go("shop");return}
  if(d.fcat!==undefined){e.preventDefault();S.f.cat=+d.fcat;S.f.subs=[];$("view").innerHTML=shopHTML();bindFilters();return}
  if(d.fsub){e.preventDefault();const s=d.fsub;S.f.subs=S.f.subs.includes(s)?S.f.subs.filter(x=>x!==s):S.f.subs.concat(s);$("view").innerHTML=shopHTML();bindFilters();return}
  if(d.fsave!==undefined){S.f.save=+d.fsave;$("view").innerHTML=shopHTML();bindFilters();return}
  if("fclear" in d){resetF();$("view").innerHTML=shopHTML();bindFilters();const q=$("q");if(q)q.value="";return}
  if(d.unf){const k=d.unf;if(k==="q"){S.f.q="";$("q").value=""}else if(k==="cat"){S.f.cat=-1;S.f.subs=[]}else if(k.startsWith("sub:"))S.f.subs=S.f.subs.filter(x=>x!==k.slice(4));else if(k==="save")S.f.save=0;else if(k==="cold")S.f.cold=false;else if(k==="stock")S.f.stock=false;else if(k==="price"){S.f.min="";S.f.max=""}
    $("view").innerHTML=shopHTML();bindFilters();return}
  if("openf" in d){$("filters").classList.add("on");return}
  if("closef" in d){$("filters").classList.remove("on");return}
  if(d.add){const i=item(d.add);setQty(d.add,i?i.min_qty:1);toast("Added to cart");afterCartChange();return}
  if(d.inc){setQty(d.inc,(S.cart[d.inc]||0)+1);afterCartChange();return}
  if(d.dec){const i=item(d.dec),n=(S.cart[d.dec]||0)-1;setQty(d.dec,i&&n<i.min_qty?0:n);afterCartChange();return}
  if(d.rm){setQty(d.rm,0);afterCartChange();return}
  if("pinc" in d||"pdec" in d){const q=$("pq"),i=item(location.hash.slice(3));q.value=Math.max(i?i.min_qty:1,(+q.value||0)+("pinc" in d?1:-1));return}
  if(d.padd||d.pbuy){const id=d.padd||d.pbuy,q=$("pq")?+$("pq").value:(S.cart[id]||1);setQty(id,q);if(d.pbuy){go("checkout")}else{toast("Cart updated");afterCartChange();openDrawer()}return}
  if(d.again){const src=(S.myOrders||[]).concat(S.curOrder?[S.curOrder]:[]).find(x=>x.id==d.again);if(!src)return;let n=0;src.lines.forEach(l=>{if(item(l.item_id)){setQty(l.item_id,+l.qty);n++}});toast(n+" products added to cart");openDrawer();refreshHeader();return}
  if(d.cancel){if(t.dataset.sure){run(async()=>{await api("cancel_order",{order_id:+d.cancel});toast("Order cancelled");render()})}else{t.dataset.sure=1;t.textContent="Tap again to cancel"}return}
  if(d.next){const o=S.deskOrders.find(x=>x.id==d.next);if(o.status===2)deliverDlg(o);else run(async()=>{await api("order_next",{order_id:o.id});render()});return}
  if(d.bill){run(()=>billDlg(+d.bill));return}
  if(d.hosp){hospDlg(d.hosp==="new"?null:S.hospitals.find(h=>h.id==d.hosp));return}
  if(d.item){itemDlg(d.item==="new"?null:S.allItems.find(i=>i.id==d.item));return}
  if(d.user){userDlg(d.user==="new"?null:S.users.find(u=>u.id==d.user));return}
  if(d.days){S.days=+d.days;render();return}
  if(d.cc!==undefined){S.cc=+d.cc;render();return}
  if(t.id==="bulk"){bulkDlg();return}
  if(t.id==="rmsamples"){if(t.dataset.sure){run(async()=>{await api("remove_samples");toast("Sample products removed");S.itemsAt=0;render()})}else{t.dataset.sure=1;t.textContent="Tap again to remove"}return}
  if(t.id==="place"){run(async()=>{
    const lines=cartLines().map(l=>{const ci=S.caseInfo[l.i.id]||{};if(l.i.category===CATS[2]&&(!ci.case_date||!ci.surgeon))throw new Error("Fill surgery date and surgeon for "+l.i.name);return{item_id:l.i.id,qty:l.q,case_date:ci.case_date||"",surgeon:ci.surgeon||""}});
    const slot=(document.querySelector('input[name="slot"]:checked')||{}).value||"";
    const r=await api("place_order",hp({lines,po_no:$("co-po").value,notes:$("co-notes").value,delivery_slot:slot,deliver_to:$("co-to").value}));
    S.cart={};S.caseInfo={};S.co=null;saveCart();go("done-"+r.order_id)})}
});
$("scrim").addEventListener("click",()=>{closeDrawer();const f=$("filters");if(f)f.classList.remove("on")});
document.addEventListener("change",e=>{const d=e.target.dataset,id=e.target.id;
  if(id==="forh"){S.forH=+e.target.value||null;store.set("cs_forh",S.forH);render();return}
  if(d.q){setQty(d.q,+e.target.value);afterCartChange();return}
  if(d.cd){(S.caseInfo[d.cd]=S.caseInfo[d.cd]||{}).case_date=e.target.value;saveCart();return}
  if(d.sg){(S.caseInfo[d.sg]=S.caseInfo[d.sg]||{}).surgeon=e.target.value.trim();saveCart();return}
  if(e.target.name==="slot"||["co-po","co-notes","co-to"].includes(id)){S.co={slot:(document.querySelector('input[name="slot"]:checked')||{}).value,po:$("co-po").value,notes:$("co-notes").value,to:$("co-to").value}}
});
document.addEventListener("input",e=>{if(e.target.id==="q")suggest(e.target.value);
  if(e.target.id==="cq"){S.cq=e.target.value;clearTimeout(S.cqt);S.cqt=setTimeout(async()=>{const p=e.target.selectionStart;$("view").innerHTML=await O.catalogue();const c=$("cq");c.focus();c.setSelectionRange(p,p)},250)}});
document.addEventListener("keydown",e=>{
  if(e.target.id==="q"){const b=$("sugg"),links=b?[...b.querySelectorAll("a")]:[];let k=links.findIndex(a=>a.classList.contains("on"));
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();if(!links.length)return;links.forEach(a=>a.classList.remove("on"));k=e.key==="ArrowDown"?Math.min(links.length-1,k+1):Math.max(0,k-1);links[k].classList.add("on");return}
    if(e.key==="Enter"){e.preventDefault();if(k>=0){links[k].click();return}S.f=Object.assign(S.f,{q:e.target.value.trim(),cat:-1,subs:[]});b.hidden=true;go("shop");return}
    if(e.key==="Escape"&&b)b.hidden=true}
  if(e.key==="Escape"){closeDrawer();const m=$("mega");if(m)m.hidden=true}});
document.addEventListener("submit",e=>{
  if(e.target.id==="payform"){e.preventDefault();run(async()=>{await api("payment_add",{hospital_id:+$("pay-h").value,amount:$("pay-a").value.replace(/[₹,\s]/g,""),pay_date:$("pay-d").value,mode:$("pay-m").value,ref:$("pay-r").value.trim()});toast("Payment saved");render()})}
  else if(e.target.id==="coform"){e.preventDefault();run(async()=>{const o={};["name","gstin","dl_no","phone","address"].forEach(k=>o[k]=$("co-"+k).value.trim());await api("settings_save",o);toast("Saved")})}});
window.addEventListener("hashchange",render);
boot();
</script>
